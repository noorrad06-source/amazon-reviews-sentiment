# ==============================================================================
# Amazon Reviews Sentiment Analysis - Configuration
# ==============================================================================

data:
  # Path to local source zip file
  zip_path: "C:\\Users\\Mahmm\\amazonreviews.zip"
  # Target directory for extracted contents
  extracted_dir: "data/raw"
  # Synthetic/offline sample dataset path
  fallback_csv_path: "data/sample_reviews.csv"
  # Classification mode: 'binary' (Negative: 1-2, Positive: 4-5) or '3-class' (Negative: 1-2, Neutral: 3, Positive: 4-5)
  classification_mode: "binary"
  # Maximum sample size to ingest for responsive training (set to null to load entire dataset)
  sample_size: 30000

split:
  # Stratified test set fraction
  test_size: 0.20
  # Reproducibility seed
  random_state: 42
  # Maintain target class balance
  stratify: true

preprocessing:
  # Normalization flags
  lowercase: true
  remove_punctuation: true
  remove_numbers: true
  remove_stopwords: true
  # Fallback to English stopword list
  language: "english"

tfidf:
  # TF-IDF Feature Extraction parameters
  max_features: 10000
  ngram_range: [1, 2]
  min_df: 2
  sublinear_tf: true
  norm: "l2"

models:
  logistic_regression:
    C: 1.0
    max_iter: 1000
    solver: "lbfgs"
    random_state: 42
  multinomial_nb:
    alpha: 1.0
    fit_prior: true
  linear_svc:
    C: 1.0
    max_iter: 2000
    random_state: 42

output:
  # Destination directory for evaluation visuals and reports
  output_dir: "outputs"
  model_dir: "outputs/models"
  best_model_filename: "best_sentiment_model.joblib"
  metrics_filename: "benchmark_summary.csv"
